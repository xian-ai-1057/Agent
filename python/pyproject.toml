[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.10.0"
description = "Python implementation of Agent Harness: a fully open-source, model-agnostic agent harness for self-hosting, data sovereignty and education."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 網頁版（pyharness web）的伺服器；litellm 本身也需要它。
    "aiohttp>=3.9",
    "litellm>=1.60",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 讓知識庫可以讀取 PDF。
pdf = ["pypdf>=4"]
# 加速知識庫的語意檢索（片段很多時建議安裝）。
vectors = ["numpy>=1.26"]
# 連接 MCP 伺服器（harness.yaml 的 mcpServers）。
mcp = ["mcp>=2"]
dev = [
    "mcp>=2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
pyharness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    # litellm 內部型別在新版 pydantic 下的雜訊，與本專案無關。
    "ignore:.*ReadOnly.*:UserWarning",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# 每行只 import 一個名稱（Google Python Style Guide）。
force-single-line = true
