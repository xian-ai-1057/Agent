[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "把既有 Python 專案的功能包成工具，交給聊天 agent 使用的輕量框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
harness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    # litellm 內部型別在新版 pydantic 下的雜訊，與本專案無關。
    "ignore:.*ReadOnly.*:UserWarning",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# 每行只 import 一個名稱（Google Python Style Guide）。
force-single-line = true
