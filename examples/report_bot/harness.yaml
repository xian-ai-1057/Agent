name: report_bot
defaultAgent: main

# 不寫 model 時使用環境變數 HARNESS_MODEL。
# model: anthropic/claude-opus-5-5

# TypeScript 版（harness）：啟動這個伺服器來取得 Python 的工具。
# 伺服器名稱（report）就是 agent 設定裡引用的 toolset 名稱。
# Python 版（pyharness）不啟動伺服器，直接載入 tools/report.py。
mcpServers:
  report:
    command: python3
    args: [tools/report_server.py]

permissions:
  mode: ask
